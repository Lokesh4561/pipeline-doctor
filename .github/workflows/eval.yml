name: evaluate
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Agent (all tools)
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
          DOCTOR_MODEL: ${{ vars.DOCTOR_MODEL || 'gemini-2.5-flash' }}
        run: python -m eval.evaluate
      - name: Baseline (log only)
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
          DOCTOR_MODEL: ${{ vars.DOCTOR_MODEL || 'gemini-2.5-flash' }}
        run: python -m eval.evaluate --baseline
      - name: Save results
        run: |
          cat eval/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/RESULTS.md eval/results*.json
          git commit -m "eval: update results" || echo "no changes"
          git push
